# Filename is registered as the npm trusted publisher: renaming it breaks publishing.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Same workflow on purpose: a release made with GITHUB_TOKEN does not trigger other workflows.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      # Publish stays on the npm CLI: it's what trusted publishing (OIDC) documents; needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public

  # Pins the new release in the ryok90-omp marketplace. GITHUB_TOKEN can't reach another repo, so
  # this uses a fine-grained PAT scoped to ryok90/omp-plugins with Actions: read and write.
  sync-catalog:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: gh workflow run sync.yml --repo ryok90/omp-plugins
        env:
          GH_TOKEN: ${{ secrets.OMP_PLUGINS_DISPATCH_TOKEN }}
